# Simulation Settings
simulation:
  time_step: 0.2
  duration: 500.0

# Vehicle Parameters
car:
  mass: 1000.0
  friction: 50.0
  aero_drag_coefficient: 0.4       # N per (m/s)^2, lumped 0.5*rho*Cd*A term
  rolling_resistance_coefficient: 0.015  # dimensionless, typical tire value ~0.01-0.02
  road_grade_percent: 0.0          # constant road slope, e.g. 5.0 = 5% uphill, -5.0 = downhill

# PID Controller Gains
pid:
  p: 50.0
  i: 1.0
  d: 5.0
  max_engine_force: 6000.0         # N, actuator saturation limit

# Initial Conditions
initial:
  start_velocity: 3.0
  goal_velocity: 20.0